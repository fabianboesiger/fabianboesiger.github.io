# NOTE: The editable site texts (title, description, lang) live in
# _data/site.yml, which is what the Pages CMS writes to. Keep them there, NOT
# here: the CMS rewrites the file it manages with only the fields it knows
# about, so anything extra in that file gets silently dropped. This file is
# intentionally NOT managed by the CMS, so the structural config below is
# safe from that.
owner:
  name: Fabian Bösiger
  email: boesiger.fabian@outlook.com
social:
  github: fabianboesiger
  twitter: fabianboesiger
  instagram: fabian_boesiger
  linkedin: fabianboesiger
permalink: /:title
markdown: kramdown
kramdown:
  smart_quotes: ["lsquo", "rsquo", "laquo", "raquo"]
  markdown: kramdown
plugins:
  - jekyll-katex
  - jekyll-compress-images
compress_images:
  images_path: "public/media/**/*.{gif,png,jpg,jpeg,svg}"
