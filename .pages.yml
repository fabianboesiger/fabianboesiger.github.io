media: public/media

settings:
  content:
    merge: true

components:
  tile_size:
    type: select
    label: Grösse
    description: "Leer lassen für automatisch: mit Bild gross (2×2), ohne Bild normal (1×1)."
    options:
      choices:
        - { value: "",     label: "Automatisch" }
        - { value: normal, label: "Normal (1×1)" }
        - { value: wide,   label: "Breit (2×1)" }
        - { value: tall,   label: "Hoch (1×2)" }
        - { value: large,  label: "Gross (2×2)" }

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, published, date]
      primary: title
      sort: [date]
      order: desc
    fields:
      - { name: title, label: Titel, type: string }
      - { name: date, label: Datum, type: date, options: { time: true } }
      - { name: published, label: Veröffentlicht, type: boolean, default: true }
      - { name: description, label: Beschreibung, type: text }
      - { name: image, label: Bild, type: image }
      - { name: tile_size, component: tile_size }
      - { name: body, label: Inhalt, type: code, options: { language: markdown } }

  - name: cards
    label: Kacheln
    path: _data/cards.yml
    type: file
    format: yaml
    fields:
      - name: items
        label: Kacheln
        type: object
        list: true
        fields:
          - { name: title, label: Titel, type: string }
          - { name: text, label: Inhalt, type: rich-text }
          - { name: image, label: Hintergrundbild, type: image }
          - { name: tile_size, component: tile_size }

  - name: fehlerseite
    label: Fehlerseite (404)
    path: 404.html
    type: file
    format: yaml-frontmatter
    fields:
      - { name: heading, label: Titel, type: string }
      - { name: message, label: Nachricht, type: text }

  - name: site
    label: Website-Einstellungen
    path: _data/site.yml
    type: file
    format: yaml
    fields:
      - { name: title, label: Website-Titel, type: string }
      - { name: description, label: Website-Beschreibung, type: string }
      - { name: lang, label: Sprache, type: string, description: "z.B. de" }
