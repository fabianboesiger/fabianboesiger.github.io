<!DOCTYPE html>
{%- assign lang = page.lang | default: site.data.site.lang %}
<html lang="{{ lang }}">
    {% include head.html %}
    <body class="post">
        <div class="content">
            <nav>
                <a href="/" class="button material-symbols-sharp">arrow_back_ios</a>
                <span id="title">{{ site.data.site.title }}</span>
                <a class="button"></a>
            </nav>
            <main>
                <article>
                    <h1>{{ page.title }}</h1>
                    <time class="date" datetime="{{ page.date | date_to_xmlschema }}">{% if lang == "en" %}{{ page.date | date: "%B %-d, %Y" }}{% else %}{{ page.date | date: "%d.%m.%Y" }}{% endif %}</time>
                    {{ content }}
                </article>
            </main>
        </div>
        {% include posts.html %}
    </body>
</html>
